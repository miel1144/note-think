name: notethink
description: "NoteThink - local-first notes app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_quill: ^11.6.0
  flutter_quill_extensions: ^11.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  image_picker: ^1.2.4
  intl: ^0.20.3
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_community_generator: ^3.3.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
